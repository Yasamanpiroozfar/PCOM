name: Validate data and reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: python -B run.py test
      - name: Validate committed corrected primary export
        run: python -B run.py validate-corrected
      - name: Validate committed records
        run: python -B run.py validate --legacy-cutoff
      - name: Independently audit captured source facts
        run: python -B tools/audit_sources.py
      - name: Reproduce every processed artifact offline
        run: python -B run.py reproduce --legacy-cutoff
      - name: Reproduce release-origin derivations
        run: |
          python -B run.py reproduce-release --scope supplied
          python -B run.py reproduce-release --scope all-precutoff
      - name: Reproduce corrected primary export
        run: python -B run.py reproduce-corrected
      - name: Independently audit release-origin candidates
        run: python -B tools/audit_release.py
      - name: Validate and reproduce expanded cohort offline
        run: python -B run.py reproduce-expanded
